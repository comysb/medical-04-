    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(to bottom, #eff6ff, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            padding-bottom: 32px;
        }
        
        .container {
            width: 100%;
            max-width: 428px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .logo-section {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo-image {
            width: 500px;
            height: auto;
            margin-bottom: 24px;
        }
        
        .slogan {
            font-size: 18px;
            color: #4b5563;
            text-align: center;
            font-weight: 500;
        }
        
        .tagline {
            max-width: 384px;
            text-align: center;
            margin-bottom: 48px;
        }
        
        .tagline h2 {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .bottom-section {
            width: 100%;
            max-width: 448px;
        }
        
        .start-button {
            width: 100%;
            background-color: #22c55e;
            color: white;
            font-weight: bold;
            font-size: 18px;
            padding: 20px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .start-button:hover {
            background-color: #16a34a;
        }
        
        .start-button:active {
            transform: scale(0.95);
        }
        
        .small-note {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-top: 12px;
        }
    </style>
