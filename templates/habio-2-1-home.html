<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABIO - 2-1 Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .container {
            width: 100%;
            max-width: 428px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            padding: 12px 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }
        
        .header-logo {
            height: 28px;
            width: auto;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .notification-icon {
            font-size: 24px;
            cursor: pointer;
        }
        
        /* Main Content */
        .main-content {
            padding: 20px;
        }
        
        /* LS Score Card */
        .ls-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 20px;
            padding: 24px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
        
        .ls-card-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        
        .ls-score {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        
        .ls-score small {
            font-size: 18px;
            opacity: 0.8;
        }
        
        .streak-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .streak-info span {
            font-weight: 600;
        }
        
        .checklist-summary {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* Daily Question Card */
        .question-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .question-card h3 {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 16px;
        }
        
        .meal-section {
            margin-bottom: 16px;
        }
        
        .meal-label {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 8px;
            display: block;
        }
        
        .meal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .meal-input:focus {
            border-color: #22c55e;
        }
        
        .submit-answer-btn {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        
        /* Shortcuts Grid */
        .shortcuts-section {
            margin-top: 24px;
        }
        
        .shortcuts-section h3 {
            font-size: 16px;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .shortcut-tile {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .shortcut-tile:hover {
            border-color: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .shortcut-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .shortcut-title {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
        }
        
        /* Bottom Tab Bar */
        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px 0;
            max-width: 428px;
            margin: 0 auto;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            text-decoration: none;
            color: #9ca3af;
            transition: color 0.2s;
        }
        
        .tab-item.active {
            color: #22c55e;
        }
        
        .tab-icon {
            font-size: 24px;
        }
        
        .tab-label {
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
